services:
  - type: worker
    name: massage-world-news-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: BOT_TIMEZONE
        value: Europe/Moscow
      - key: DIGEST_HOUR
        value: "9"
      - key: DIGEST_MINUTE
        value: "0"
