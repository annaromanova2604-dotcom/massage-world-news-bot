name: Daily massage news
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: massage-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: massage-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: massage-sent-
      - name: Collect and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: massage-sent-${{ github.run_id }}-${{ github.run_attempt }}
